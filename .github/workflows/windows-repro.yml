name: q2823-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: reference
        type: choice
        options: [reference, verify]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Start PostgreSQL17
        shell: pwsh
        run: |
          $service=Get-Service -Name postgresql-x64-17 -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $psql=Join-Path $env:PGBIN psql.exe
          $ready=Join-Path $env:PGBIN pg_isready.exe
          for($attempt=1;$attempt -le 15;$attempt++){& $ready --host=127.0.0.1 --port=5432 --username=postgres;if($LASTEXITCODE -eq 0){break};Start-Sleep -Seconds 2}
          if($LASTEXITCODE -ne 0){throw 'PostgreSQL17 unavailable'}
          "PSQL_PATH=$psql"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SERVER_ADMIN_URL=postgresql://postgres:root@127.0.0.1:5432/postgres"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REFERENCE_DATABASE_URL=postgresql://postgres:root@127.0.0.1:5432/postgres"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence|Out-Null
          [ordered]@{caption=(Get-CimInstance Win32_OperatingSystem).Caption;version=(Get-CimInstance Win32_OperatingSystem).Version;build=(Get-CimInstance Win32_OperatingSystem).BuildNumber;runner_image=$env:ImageOS;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID;python_version=(python --version)}|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          & $env:PSQL_PATH --version|Set-Content -Encoding utf8NoBOM evidence/postgresql-version.txt
      - name: Generate Reference candidate
        if: ${{ inputs.mode == 'reference' }}
        shell: pwsh
        run: python ./qa/generate_reference.py
      - name: Verify final task
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $pythonPath=(Get-Command python).Source
          New-NetFirewallRule -DisplayName q2823-python-no-external -Direction Outbound -Program $pythonPath -Action Block|Out-Null
          New-NetFirewallRule -DisplayName q2823-psql-no-internet -Direction Outbound -Program $env:PSQL_PATH -RemoteAddress Internet -Action Block|Out-Null
          python ./qa/verify_hashes.py
          python ./qa/windows_verify.py
      - name: Remove process network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2823-*-no-* -ErrorAction SilentlyContinue|Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: q2823-windows-evidence, path: 'evidence/**', if-no-files-found: error, retention-days: 1}
